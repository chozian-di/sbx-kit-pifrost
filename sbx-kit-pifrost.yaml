            }
        - path: /home/agent/.pi/agent/settings.json
          mode: "0644"
          description: Pi settings
          content: |
            {
              "lastChangelogVersion": "1.4.0",
              "defaultProvider": "bifrost",
              "defaultModel": "gpt-5.6-luna",
              "hideThinkingBlock": true,
              "enabledModels": [
