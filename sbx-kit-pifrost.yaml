  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - user: "1000"
          description: Configure npm to use the sandbox proxy for Pi runtime installs
          env: [HTTP_PROXY, HTTPS_PROXY]
          command: >-
            if [ -n "${HTTP_PROXY:-}" ]; then npm config set proxy="$HTTP_PROXY"
            https-proxy="${HTTPS_PROXY:-$HTTP_PROXY}"; fi
        - user: "0"
          description: Install Bash completion, fd-find, and a Git pager; restore Vim command aliases
          command: >-
            set -eu; mkdir -p /home/agent/.pi/agent/themes;
            chown -R agent:agent /home/agent/.pi; apt-get
            update -qq; DEBIAN_FRONTEND=noninteractive apt-get install -y
            --no-install-recommends bash-completion fd-find less;
            update-alternatives --install /usr/bin/pager pager /usr/bin/less 100;
            update-alternatives --set pager /usr/bin/less;
            update-alternatives --install /usr/bin/vi vi /usr/bin/vim.basic 30;
            update-alternatives --install /usr/bin/vim vim /usr/bin/vim.basic 30;
            apt-get clean; rm -rf /var/lib/apt/lists/*; command -v less; command -v pager; test "$(readlink -f /usr/bin/pager)" = /usr/bin/less; command -v vi; command -v vim;
            command -v python; python --version
      files:
        - path: /etc/sandbox-persistent.sh
          mode: "0644"
          description: Persistent shell environment
          content: |
            # User environment shared by Docker Sandbox shells and agent commands.

            # Default shell and editor for interactive shell tools
            # The shell workload's login shell is /bin/sh, but tmux uses SHELL when it
            # creates a window. Use Bash so tmux loads the same interactive configuration
            # as the main sandbox shell.
            export SHELL=/bin/bash
            export EDITOR=vim
            export VISUAL=vim

            if [ -n "${HOME-}" ]; then
            	case ":${PATH-}:" in
            		*:"$HOME/.local/bin":*) ;;
            		*) PATH="$HOME/.local/bin${PATH:+:$PATH}" ;;
            	esac

            	case ":${PATH-}:" in
            		*:"$HOME/bin":*) ;;
            		*) PATH="$HOME/bin${PATH:+:$PATH}" ;;
            	esac

            	export PATH
            fi
        - path: /home/agent/.bashrc
          mode: "0644"
          description: Bash configuration
          content: |
            # ~/.bashrc: executed by bash(1) for non-login shells.
            # see /usr/share/doc/bash/examples/startup-files (in the package bash-doc)
            # for examples

            # Source the sandbox persistent environment file
            if [ -f /etc/sandbox-persistent.sh ]; then
                . /etc/sandbox-persistent.sh
            fi

            # Export BASH_ENV for child non-interactive shells
            export BASH_ENV=/etc/sandbox-persistent.sh

            # If not running interactively, don't do anything
            case $- in
                *i*) ;;
                  *) return;;
            esac

            # don't put duplicate lines or lines starting with space in the history.
            # See bash(1) for more options
            HISTCONTROL=ignoreboth

            # append to the history file, don't overwrite it
            shopt -s histappend

            # for setting history length see HISTSIZE and HISTFILESIZE in bash(1)
            HISTSIZE=100000
            HISTFILESIZE=200000

            # check the window size after each command and, if necessary,
            # update the values of LINES and COLUMNS.
            shopt -s checkwinsize

            # If set, the pattern "**" used in a pathname expansion context will
            # match all files and zero or more directories and subdirectories.
            #shopt -s globstar

            # make less more friendly for non-text input files, see lesspipe(1)
            [ -x /usr/bin/lesspipe ] && eval "$(SHELL=/bin/sh lesspipe)"

            # set variable identifying the chroot you work in (used in the prompt below)
            if [ -z "${debian_chroot:-}" ] && [ -r /etc/debian_chroot ]; then
                debian_chroot=$(cat /etc/debian_chroot)
            fi

            # set a fancy prompt (non-color, unless we know we "want" color)
            git_prompt=
            if [ -r /usr/lib/git-core/git-sh-prompt ]; then
                . /usr/lib/git-core/git-sh-prompt
            elif [ -r /usr/share/git-core/contrib/completion/git-prompt.sh ]; then
                . /usr/share/git-core/contrib/completion/git-prompt.sh
            fi

            if declare -F __git_ps1 >/dev/null 2>&1; then
                # GIT_PS1_SHOWDIRTYSTATE=1
                # GIT_PS1_SHOWUNTRACKEDFILES=1
                git_prompt='$(__git_ps1 " (%s)")'
            fi

            case "$TERM" in
                xterm-color|*-256color|screen|screen-*|tmux|tmux-*) color_prompt=yes;;
            esac

            # uncomment for a colored prompt, if the terminal has the capability; turned
            # off by default to not distract the user: the focus in a terminal window
            # should be on the output of commands, not on the prompt
            #force_color_prompt=yes

            if [ -n "$force_color_prompt" ]; then
                if [ -x /usr/bin/tput ] && tput setaf 1 >&/dev/null; then
            	# We have color support; assume it's compliant with Ecma-48
            	# (ISO/IEC-6429). (Lack of such support is extremely rare, and such
            	# a case would tend to support setf rather than setaf.)
            	color_prompt=yes
                else
            	color_prompt=
                fi
            fi

            if [ "$color_prompt" = yes ]; then
                PS1='${debian_chroot:+($debian_chroot)}\[\033[32m\]\u@\h\[\033[0m\]:\[\033[34m\]\w\[\033[0m\]'"$git_prompt"'\$ '
            else
                PS1='${debian_chroot:+($debian_chroot)}\u@\h:\w'"$git_prompt"'\$ '
            fi
            unset color_prompt force_color_prompt

            # If this is an xterm set the title to user@host:dir
            case "$TERM" in
            xterm*|rxvt*)
                PS1="\[\e]0;${debian_chroot:+($debian_chroot)}\u@\h: \w\a\]$PS1"
                ;;
            *)
                ;;
            esac

            # enable color support of ls and also add handy aliases
            if [ -x /usr/bin/dircolors ]; then
                test -r ~/.dircolors && eval "$(dircolors -b ~/.dircolors)" || eval "$(dircolors -b)"
                alias ls='ls --color=auto'
                #alias dir='dir --color=auto'
                #alias vdir='vdir --color=auto'

                alias grep='grep --color=auto'
                alias fgrep='fgrep --color=auto'
                alias egrep='egrep --color=auto'
            fi

            # colored GCC warnings and errors
            #export GCC_COLORS='error=01;31:warning=01;35:note=01;36:caret=01;32:locus=01:quote=01'

            # some more ls aliases
            alias ll='ls -alF'
            alias la='ls -A'
            alias l='ls -CF'

            # Add an "alert" alias for long running commands.  Use like so:
            #   sleep 10; alert
            alias alert='notify-send --urgency=low -i "$([ $? = 0 ] && echo terminal || echo error)" "$(history|tail -n1|sed -e '\''s/^\s*[0-9]\+\s*//;s/[;&|]\s*alert$//'\'')"'

            # Alias definitions.
            # You may want to put all your additions into a separate file like
            # ~/.bash_aliases, instead of adding them here directly.
            # See /usr/share/doc/bash-doc/examples in the bash-doc package.

            if [ -f ~/.bash_aliases ]; then
                . ~/.bash_aliases
            fi

            # enable programmable completion features (you don't need to enable
            # this, if it's already enabled in /etc/bash.bashrc and /etc/profile
            # sources /etc/bash.bashrc).
            if ! shopt -oq posix; then
              if [ -f /usr/share/bash-completion/bash_completion ]; then
                . /usr/share/bash-completion/bash_completion
              elif [ -f /etc/bash_completion ]; then
                . /etc/bash_completion
              fi
            fi
        - path: /home/agent/.bash_aliases
          mode: "0644"
          description: Bash aliases
          content: |
            alias ll='ls -alF'
            alias la='ls -A'
            alias l='ls -CF'

            alias rm='rm -i'
            alias cp='cp -i'
            alias mv='mv -i'
        - path: /home/agent/.dircolors
          mode: "0644"
          description: Dircolors
          content: |
            DIR 34
            LINK 36
            EXEC 32
        - path: /home/agent/.pi/agent/models.json
          mode: "0644"
          description: Pi model configuration
          content: |
            {
