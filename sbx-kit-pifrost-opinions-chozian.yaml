# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
# Generated by scripts/render-kit-set.py from files/ and optional host Pi config.
schemaVersion: "3"
displayName: SBX Kit pifrost opinions (chozian)
author: "chozian"
description: >-
  Optional chozian shell, editor, and Pi configuration for the Pifrost
  workload, including the pinned Simple English writing skill.
kind: mixin
dockerfile: sbx-kit-pifrost-opinions-chozian.dockerfile
version: "1.0.0"
capabilities:
  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        This optional mixin supplies chozian's current Pi and shell preferences.

        It provides the `simple-english` skill. Invoke it with
        `/skill:simple-english` when needed.

        It installs Bash completion and Solarized Vim support. The core Pifrost set
        provides the Python 3 compatibility command `python`, BIFROST_URL, and the
        Bifrost provider extension through the bundled Pi mixin. The selected Shell
        workload already provides htop, less, tmux, and vim; this mixin does not
        reinstall those packages. It also installs the reviewed files under `files/`,
        including the current Pi settings snapshot and shell/editor configuration.

        The Bifrost credential remains host-side. Do not print or reconfigure its
        sentinel value.

  # Expose the image-bundled skill through the Pi discovery directory.
  - type: com.docker.sandbox/agent-skill@1
    name: Simple English
    config:
      path: /usr/local/share/sbx-kit-pifrost-opinions/simple-english
      name: simple-english

  # The package hook is create-time and uses the selected workload's
  # Debian package sources. Base-provided tools are not reinstalled.
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - deb.debian.org
          - dhi.io

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - user: "0"
          description: Install chozian shell conveniences and restore Vim command aliases
          command: >-
            set -eu; mkdir -p /home/agent/.pi/agent;
            chown -R agent:agent /home/agent/.pi; apt-get
            update -qq; DEBIAN_FRONTEND=noninteractive apt-get install -y
            --no-install-recommends bash-completion vim-solarized;
            update-alternatives --install /usr/bin/vi vi /usr/bin/vim.basic 30;
            update-alternatives --install /usr/bin/vim vim /usr/bin/vim.basic 30;
            update-alternatives --install /usr/bin/view view /usr/bin/vim.basic 30;
            apt-get clean; rm -rf /var/lib/apt/lists/*;
            command -v htop; command -v less; command -v tmux; command -v vim;
            command -v vi; command -v view;
            test "$(readlink -f /usr/bin/vi)" = /usr/bin/vim.basic;
            test "$(readlink -f /usr/bin/vim)" = /usr/bin/vim.basic;
            test "$(readlink -f /usr/bin/view)" = /usr/bin/vim.basic;
            test -f /usr/share/bash-completion/bash_completion;
            command -v python; python --version
      files:
        - path: /etc/sandbox-persistent.sh
          mode: "0644"
          description: Persistent shell environment
          content: |
            # User environment shared by Docker Sandbox shells and agent commands.

            # Default shell and editor for interactive shell tools
            # The shell workload's login shell is /bin/sh, but tmux uses SHELL when it
            # creates a window. Use Bash so tmux loads the same interactive configuration
            # as the main sandbox shell.
            export SHELL=/bin/bash
            export EDITOR=vim
            export VISUAL=vim

            if [ -n "${HOME-}" ]; then
                case ":${PATH-}:" in
                    *:"$HOME/.local/bin":*) ;;
                    *) PATH="$HOME/.local/bin${PATH:+:$PATH}" ;;
                esac

                case ":${PATH-}:" in
                    *:"$HOME/bin":*) ;;
                    *) PATH="$HOME/bin${PATH:+:$PATH}" ;;
                esac

                export PATH
            fi
        - path: /home/agent/.bashrc
          mode: "0644"
          description: Bash configuration
          content: |
            # ~/.bashrc: executed by bash(1) for non-login shells.
            # see /usr/share/doc/bash/examples/startup-files (in the package bash-doc)
            # for examples

            # Source the sandbox persistent environment file
            if [ -f /etc/sandbox-persistent.sh ]; then
                . /etc/sandbox-persistent.sh
            fi

            # Export BASH_ENV for child non-interactive shells
            export BASH_ENV=/etc/sandbox-persistent.sh

            # If not running interactively, don't do anything
            case $- in
                *i*) ;;
                  *) return;;
            esac

            # don't put duplicate lines or lines starting with space in the history.
            # See bash(1) for more options
            HISTCONTROL=ignoreboth

            # append to the history file, don't overwrite it
            shopt -s histappend

            # for setting history length see HISTSIZE and HISTFILESIZE in bash(1)
            HISTSIZE=100000
            HISTFILESIZE=200000

            # check the window size after each command and, if necessary,
            # update the values of LINES and COLUMNS.
            shopt -s checkwinsize

            # If set, the pattern "**" used in a pathname expansion context will
            # match all files and zero or more directories and subdirectories.
            #shopt -s globstar

            # make less more friendly for non-text input files, see lesspipe(1)
            [ -x /usr/bin/lesspipe ] && eval "$(SHELL=/bin/sh lesspipe)"

            # set variable identifying the chroot you work in (used in the prompt below)
            if [ -z "${debian_chroot:-}" ] && [ -r /etc/debian_chroot ]; then
                debian_chroot=$(cat /etc/debian_chroot)
            fi

            # set a fancy prompt (non-color, unless we know we "want" color)
            git_prompt=
            if [ -r /usr/lib/git-core/git-sh-prompt ]; then
                . /usr/lib/git-core/git-sh-prompt
            elif [ -r /usr/share/git-core/contrib/completion/git-prompt.sh ]; then
                . /usr/share/git-core/contrib/completion/git-prompt.sh
            fi

            if declare -F __git_ps1 >/dev/null 2>&1; then
                GIT_PS1_SHOWDIRTYSTATE=1
                GIT_PS1_SHOWUNTRACKEDFILES=1
                git_prompt='$(__git_ps1 " (%s)")'
            fi

            case "$TERM" in
                xterm-color|*-256color|screen|screen-*|tmux|tmux-*) color_prompt=yes;;
            esac

            # uncomment for a colored prompt, if the terminal has the capability; turned
            # off by default to not distract the user: the focus in a terminal window
            # should be on the output of commands, not on the prompt
            #force_color_prompt=yes

            if [ -n "$force_color_prompt" ]; then
                if [ -x /usr/bin/tput ] && tput setaf 1 >&/dev/null; then
                # We have color support; assume it's compliant with Ecma-48
                # (ISO/IEC-6429). (Lack of such support is extremely rare, and such
                # a case would tend to support setf rather than setaf.)
                color_prompt=yes
                else
                color_prompt=
                fi
            fi

            if [ "$color_prompt" = yes ]; then
                # Solarized Dark maps bright blue to base0, its high-contrast foreground;
                # plain blue is too difficult to read against the base03 background.
                PS1='${debian_chroot:+($debian_chroot)}\[\033[32m\]\u@\h\[\033[0m\]:\[\033[01;34m\]\w\[\033[0m\]'"$git_prompt"'\$ '
            else
                PS1='${debian_chroot:+($debian_chroot)}\u@\h:\w'"$git_prompt"'\$ '
            fi
            unset color_prompt force_color_prompt

            # If this is an xterm set the title to user@host:dir
            case "$TERM" in
            xterm*|rxvt*)
                PS1="\[\e]0;${debian_chroot:+($debian_chroot)}\u@\h: \w\a\]$PS1"
                ;;
            *)
                ;;
            esac

            # enable color support of ls and also add handy aliases
            if [ -x /usr/bin/dircolors ]; then
                test -r ~/.dircolors && eval "$(dircolors -b ~/.dircolors)" || eval "$(dircolors -b)"
                alias ls='ls --color=auto'
                #alias dir='dir --color=auto'
                #alias vdir='vdir --color=auto'

                alias grep='grep --color=auto'
                alias fgrep='fgrep --color=auto'
                alias egrep='egrep --color=auto'
            fi

            # colored GCC warnings and errors
            #export GCC_COLORS='error=01;31:warning=01;35:note=01;36:caret=01;32:locus=01:quote=01'

            # some more ls aliases
            alias ll='ls -alF'
            alias la='ls -A'
            alias l='ls -CF'

            # Add an "alert" alias for long running commands.  Use like so:
            #   sleep 10; alert
            alias alert='notify-send --urgency=low -i "$([ $? = 0 ] && echo terminal || echo error)" "$(history|tail -n1|sed -e '\''s/^\s*[0-9]\+\s*//;s/[;&|]\s*alert$//'\'')"'

            # Alias definitions.
            # You may want to put all your additions into a separate file like
            # ~/.bash_aliases, instead of adding them here directly.
            # See /usr/share/doc/bash-doc/examples in the bash-doc package.

            if [ -f ~/.bash_aliases ]; then
                . ~/.bash_aliases
            fi

            # enable programmable completion features (you don't need to enable
            # this, if it's already enabled in /etc/bash.bashrc and /etc/profile
            # sources /etc/bash.bashrc).
            if ! shopt -oq posix; then
              if [ -f /usr/share/bash-completion/bash_completion ]; then
                . /usr/share/bash-completion/bash_completion
              elif [ -f /etc/bash_completion ]; then
                . /etc/bash_completion
              fi
            fi

            # Enable OSC 52 clipboard integration for Pi.
            export PI_CLIPBOARD_OSC52=1
        - path: /home/agent/.bash_aliases
          mode: "0644"
          description: Bash aliases
          content: |
            alias ll='ls -alF'
            alias la='ls -A'
            alias l='ls -CF'

            alias rm='rm -i'
            alias cp='cp -i'
            alias mv='mv -i'
        - path: /home/agent/.dircolors
          mode: "0644"
          description: Dircolors
          content: |
            # Exact Solarized Dark color theme for the color GNU ls utility.
            # Designed for dircolors (GNU coreutils) 5.97
            #
            # This simple theme was simultaneously designed for these terminal color schemes:
            # - Solarized dark  (best)
            # - Solarized light
            # - default dark
            # - default light
            # with a slight optimization for Solarized Dark.
            #
            # How the colors were selected:
            # - Terminal emulators often have an option typically enabled by default that makes
            #   bold a different color.  It is important to leave this option enabled so that
            #   you can access the entire 16-color Solarized palette, and not just 8 colors.
            # - We favor universality over a greater number of colors.  So we limit the number
            #   of colors so that this theme will work out of the box in all terminals,
            #   Solarized or not, dark or light.
            # - We choose to have the following category of files:
            #   NORMAL & FILE, DIR, LINK, EXEC and
            #   editable text including source, unimportant text, binary docs & multimedia source
            #   files, viewable multimedia, archived/compressed, and unimportant non-text
            # - For uniqueness, we stay away from the Solarized foreground colors are -- either
            #   base00 (brightyellow) or base0 (brightblue).  However, they can be used if
            #   you know what the bg/fg colors of your terminal are, in order to optimize the display.
            # - 3 different options are provided: universal, solarized dark, and solarized light.
            #   The only difference between the universal scheme and one that's optimized for
            #   dark/light is the color of "unimportant" files, which should blend more with the
            #   background
            # - We note that blue is the hardest color to see on dark bg and yellow is the hardest
            #   color to see on light bg (with blue being particularly bad).  So we choose yellow
            #   for multimedia files which are usually accessed in a GUI folder browser anyway.
            #   And blue is kept for custom use of this scheme's user.
            # - See table below to see the assignments.


            # Installation instructions:
            # This file goes in the /etc directory, and must be world readable.
            # You can copy this file to .dir_colors in your $HOME directory to override
            # the system defaults.

            # COLOR needs one of these arguments: 'tty' colorizes output to ttys, but not
            # pipes. 'all' adds color characters to all output. 'none' shuts colorization
            # off.
            COLOR tty

            # Below, there should be one TERM entry for each termtype that is colorizable
            TERM alacritty
            TERM ansi
            TERM color_xterm
            TERM color-xterm
            TERM con132x25
            TERM con132x30
            TERM con132x43
            TERM con132x60
            TERM con80x25
            TERM con80x28
            TERM con80x30
            TERM con80x43
            TERM con80x50
            TERM con80x60
            TERM cons25
            TERM console
            TERM cygwin
            TERM dtterm
            TERM dvtm
            TERM dvtm-256color
            TERM eat-256color
            TERM eat-truecolor
            TERM Eterm
            TERM eterm-color
            TERM fbterm
            TERM foot
            TERM gnome
            TERM gnome-256color
            TERM jfbterm
            TERM konsole
            TERM konsole-256color
            TERM kterm
            TERM linux
            TERM linux-16color
            TERM linux-c
            TERM mach-color
            TERM mlterm
            TERM nxterm
            TERM putty
            TERM putty-256color
            TERM rxvt
            TERM rxvt-256color
            TERM rxvt-cygwin
            TERM rxvt-cygwin-native
            TERM rxvt-unicode
            TERM rxvt-unicode256
            TERM rxvt-unicode-256color
            TERM screen
            TERM screen-16color
            TERM screen-16color-bce
            TERM screen-16color-s
            TERM screen-16color-bce-s
            TERM screen-256color
            TERM screen-256color-bce
            TERM screen-256color-s
            TERM screen-256color-bce-s
            TERM screen-256color-italic
            TERM screen-bce
            TERM screen-w
            TERM screen.linux
            TERM screen.xterm-256color
            TERM screen.xterm-new
            TERM st
            TERM st-meta
            TERM st-256color
            TERM st-meta-256color
            TERM tmux
            TERM tmux-256color
            TERM vt100
            TERM xterm
            TERM xterm-new
            TERM xterm-16color
            TERM xterm-256color
            TERM xterm-256color-italic
            TERM xterm-88color
            TERM xterm-color
            TERM xterm-debian
            TERM xterm-ghostty
            TERM xterm-kitty
            TERM xterm-termite

            # EIGHTBIT, followed by '1' for on, '0' for off. (8-bit output)
            EIGHTBIT 1

            #############################################################################
            # Below are the color init strings for the basic file types. A color init
            # string consists of one or more of the following numeric codes:
            #
            # Attribute codes:
            #   00=none 01=bold 04=underscore 05=blink 07=reverse 08=concealed
            # Text color codes:
            #   30=black 31=red 32=green 33=yellow 34=blue 35=magenta 36=cyan 37=white
            # Background color codes:
            #   40=black 41=red 42=green 43=yellow 44=blue 45=magenta 46=cyan 47=white
            #
            # NOTES:
            # - See http://www.oreilly.com/catalog/wdnut/excerpt/color_names.html
            # - Color combinations
            #   ANSI Color code       Solarized  Notes                Universal             SolDark              SolLight
            #   ~~~~~~~~~~~~~~~       ~~~~~~~~~  ~~~~~                ~~~~~~~~~             ~~~~~~~              ~~~~~~~~
            #   00    none                                            NORMAL, FILE          <SAME>               <SAME>
            #   30    black           base02
            #   01;30 bright black    base03     bg of SolDark
            #   31    red             red                             docs & mm src         <SAME>               <SAME>
            #   01;31 bright red      orange                          EXEC                  <SAME>               <SAME>
            #   32    green           green                           editable text         <SAME>               <SAME>
            #   01;32 bright green    base01                          unimportant text      <SAME>
            #   33    yellow          yellow     unclear in light bg  multimedia            <SAME>               <SAME>
            #   01;33 bright yellow   base00     fg of SolLight                             unimportant non-text
            #   34    blue            blue       unclear in dark bg   user customized       <SAME>               <SAME>
            #   01;34 bright blue     base0      fg in SolDark                                                   unimportant text
            #   35    magenta         magenta                         LINK                  <SAME>               <SAME>
            #   01;35 bright magenta  violet                          archive/compressed    <SAME>               <SAME>
            #   36    cyan            cyan                            DIR                   <SAME>               <SAME>
            #   01;36 bright cyan     base1                           unimportant non-text                       <SAME>
            #   37    white           base2
            #   01;37 bright white    base3      bg in SolLight
            #   05;37;41                         unclear in Putty dark


            ### By file type

            # global default
            NORMAL 00
            # normal file
            FILE 00
            # directory
            DIR 34
            # 777 directory
            OTHER_WRITABLE 34;40
            # symbolic link
            LINK 35

            # pipe, socket, block device, character device (blue bg)
            FIFO 30;44
            SOCK 35;44
            DOOR 35;44 # Solaris 2.5 and later
            BLK  33;44
            CHR  37;44


            #############################################################################
            ### By file attributes

            # Orphaned symlinks (blinking white on red)
            # Blink may or may not work (works on iTerm dark or light, and Putty dark)
            ORPHAN  05;37;41
            # ... and the files that orphaned symlinks point to (blinking white on red)
            MISSING 05;37;41

            # files with execute permission
            EXEC 01;31  # Unix
            .cmd 01;31  # Win
            .exe 01;31  # Win
            .com 01;31  # Win
            .bat 01;31  # Win
            .reg 01;31  # Win
            .app 01;31  # OSX

            #############################################################################
            ### By extension

            # List any file extensions like '.gz' or '.tar' that you would like ls
            # to colorize below. Put the extension, a space, and the color init string.
            # (and any comments you want to add after a '#')

            ### Text formats

            # Text that we can edit with a regular editor
            .txt 32
            .org 32
            .md 32
            .mkd 32

            # Source text
            .h 32
            .hpp 32
            .c 32
            .C 32
            .cc 32
            .cpp 32
            .cxx 32
            .objc 32
            .cl 32
            .sh 32
            .bash 32
            .csh 32
            .zsh 32
            .el 32
            .vim 32
            .java 32
            .lua 32
            .pl 32
            .pm 32
            .py 32
            .rb 32
            .hs 32
            .php 32
            .htm 32
            .html 32
            .shtml 32
            .erb 32
            .haml 32
            .xml 32
            .rdf 32
            .css 32
            .sass 32
            .scss 32
            .less 32
            .js 32
            .coffee 32
            .man 32
            .0 32
            .1 32
            .2 32
            .3 32
            .4 32
            .5 32
            .6 32
            .7 32
            .8 32
            .9 32
            .l 32
            .n 32
            .p 32
            .pod 32
            .tex 32
            .go 32
            .sql 32
            .csv 32
            .sv 32
            .svh 32
            .v 32
            .vh 32
            .vhd 32

            ### Multimedia formats

            # Image
            .bmp 33
            .cgm 33
            .dl 33
            .dvi 33
            .emf 33
            .eps 33
            .gif 33
            .jpeg 33
            .jpg 33
            .JPG 33
            .mng 33
            .pbm 33
            .pcx 33
            .pgm 33
            .png 33
            .PNG 33
            .ppm 33
            .pps 33
            .ppsx 33
            .ps 33
            .svg 33
            .svgz 33
            .tga 33
            .tif 33
            .tiff 33
            .xbm 33
            .xcf 33
            .xpm 33
            .xwd 33
            .xwd 33
            .yuv 33
            .nef 33 # Nikon RAW format
            .NEF 33
            .webp 33
            .heic 33
            .HEIC 33
            .avif 33

            # Audio
            .aac 33
            .au  33
            .flac 33
            .m4a 33
            .mid 33
            .midi 33
            .mka 33
            .mp3 33
            .mpa 33
            .mpeg 33
            .mpg 33
            .ogg  33
            .opus 33
            .ra 33
            .wav 33

            # Video
            .anx 33
            .asf 33
            .avi 33
            .axv 33
            .flc 33
            .fli 33
            .flv 33
            .gl 33
            .m2v 33
            .m4v 33
            .mkv 33
            .mov 33
            .MOV 33
            .mp4 33
            .mp4v 33
            .mpeg 33
            .mpg 33
            .nuv 33
            .ogm 33
            .ogv 33
            .ogx 33
            .qt 33
            .rm 33
            .rmvb 33
            .swf 33
            .vob 33
            .webm 33
            .wmv 33

            ### Misc

            # Binary document formats and multimedia source
            .doc 31
            .docx 31
            .rtf 31
            .odt 31
            .dot 31
            .dotx 31
            .ott 31
            .xls 31
            .xlsx 31
            .ods 31
            .ots 31
            .ppt 31
            .pptx 31
            .odp 31
            .otp 31
            .fla 31
            .psd 31
            .pdf 31

            # Archives, compressed
            .7z   1;35
            .apk  1;35
            .arj  1;35
            .bin  1;35
            .bz   1;35
            .bz2  1;35
            .cab  1;35  # Win
            .deb  1;35
            .dmg  1;35  # OSX
            .gem  1;35
            .gz   1;35
            .iso  1;35
            .jar  1;35
            .msi  1;35  # Win
            .rar  1;35
            .rpm  1;35
            .tar  1;35
            .tbz  1;35
            .tbz2 1;35
            .tgz  1;35
            .tx   1;35
            .war  1;35
            .xpi  1;35
            .xz   1;35
            .z    1;35
            .Z    1;35
            .zip  1;35
            .zst  1;35

            # For testing
            .ANSI-30-black 30
            .ANSI-01;30-brblack 01;30
            .ANSI-31-red 31
            .ANSI-01;31-brred 01;31
            .ANSI-32-green 32
            .ANSI-01;32-brgreen 01;32
            .ANSI-33-yellow 33
            .ANSI-01;33-bryellow 01;33
            .ANSI-34-blue 34
            .ANSI-01;34-brblue 01;34
            .ANSI-35-magenta 35
            .ANSI-01;35-brmagenta 01;35
            .ANSI-36-cyan 36
            .ANSI-01;36-brcyan 01;36
            .ANSI-37-white 37
            .ANSI-01;37-brwhite 01;37

            #############################################################################
            # Your customizations

            # Unimportant text files
            # For universal scheme, use brightgreen 01;32
            # For optimal on light bg (but too prominent on dark bg), use white 01;34
            .log 01;32
            *~ 01;32
            *# 01;32
            #.log 01;34
            #*~ 01;34
            #*# 01;34

            # Unimportant non-text files
            # For universal scheme, use brightcyan 01;36
            # For optimal on dark bg (but too prominent on light bg), change to 01;33
            #.bak 01;36
            #.BAK 01;36
            #.old 01;36
            #.OLD 01;36
            #.org_archive 01;36
            #.off 01;36
            #.OFF 01;36
            #.dist 01;36
            #.DIST 01;36
            #.orig 01;36
            #.ORIG 01;36
            #.swp 01;36
            #.swo 01;36
            #*,v 01;36
            .bak 01;33
            .BAK 01;33
            .old 01;33
            .OLD 01;33
            .org_archive 01;33
            .off 01;33
            .OFF 01;33
            .dist 01;33
            .DIST 01;33
            .orig 01;33
            .ORIG 01;33
            .swp 01;33
            .swo 01;33
            *,v 01;33

            # The brightmagenta (Solarized: purple) color is free for you to use for your
            # custom file type
            .gpg 34
            .pgp 34
            .asc 34
            .3des 34
            .aes 34
            .enc 34
            .sqlite 34
        - path: /home/agent/.vimrc
          mode: "0644"
          description: Vim configuration
          content: |
            " Solarized Dark Vim configuration.
            " Use the 256-color fallback for terminals that do not provide the
            " Solarized ANSI palette.
            syntax enable
            set background=dark
            let g:solarized_termcolors=256
            colorscheme solarized
        - path: /home/agent/.pi/agent/settings.json
          mode: "0644"
          description: Pi settings
          content: |
            {
              "lastChangelogVersion": "1.5.0",
              "hideThinkingBlock": true,
              "enableSkillCommands": true,
              "showHardwareCursor": false,
              "terminal": {
                "showTerminalProgress": true,
                "clearOnShrink": false
              },
              "steeringMode": "one-at-a-time",
              "followUpMode": "one-at-a-time",
              "transport": "auto",
              "sessionShareDestination": "auto",
              "cacheWarming": "streaming",
              "markdown": {
                "mermaid": "streaming"
